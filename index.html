  const MIN = 20, MAX = 50;                // scale of the range control (data: 21–48)
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const $ = s => document.querySelector(s);
  const stage = $('#stage');

  // ---------- fit the 1080×1350 stage to the window ----------
  const fit = () => {
    const s = Math.min(innerWidth / 1080, innerHeight / 1350);
    stage.style.transform = `scale(${s})`;
    $('#wrap').style.width = 1080 * s + 'px'; $('#wrap').style.height = 1350 * s + 'px';
  };
  addEventListener('resize', fit); fit();

  // ---------- camera: chart y 58..574 into screen 318..1080 ----------
  const BASE = (() => { const s = (1080 - 318) / (574 - 58); return { s, tx: (1080 - 485 * s) / 2, ty: 318 - 58 * s }; })();
  const cam = $('#cam');
  cam.setAttribute('transform', `translate(${BASE.tx},${BASE.ty}) scale(${BASE.s})`);
  const toScreen = (x, y) => [BASE.tx + x * BASE.s, BASE.ty + y * BASE.s];
  const lg = $('#legend');

  // ---------- EU outline + ghosts ----------

  const euLabel = el('text', { x: 381.1, y: 124.5, 'font-size': 6.4, 'font-weight': 700, fill: '#1d1b1e', 'font-family': 'Montserrat' }, outline);
  ['European', 'Union', '(EU27)'].forEach((t, i) => { const ts = el('tspan', { x: 381.1, dy: i ? 7.8 : 0 }, euLabel); ts.textContent = t; });
  const fitLabels = [];
  const ghosts = el('g', {}, cam);
  D.ghosts.forEach(g => {
    const lines = g.name.split('|');
    const t = el('text', { x: g.cx, y: g.cy + 2 - (lines.length - 1) * 3.6, 'text-anchor': 'middle', 'font-size': LABEL,

    lines.forEach((ln, i) => { const ts = el('tspan', { x: g.cx, dy: i ? 7.2 : 0 }, t); ts.textContent = ln; });
    fitLabels.push(t);
  });

  // ---------- pills ----------

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  D.pills.forEach((p, i) => {
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    const g = el('g', { class: 'pill', tabindex: 0, role: 'button',
      'aria-label': `${p.city}, ${p.country}: congestion ${p.index}%, ${p.minutes} minutes to drive 10 km` }, pillsG);
    const card = el('rect', { x: p.x - 3.5, y: p.y - 11.5, width: p.w + 7, height: p.h + 15, rx: 3, fill: '#fff',
      stroke: '#c9c9cb', 'stroke-width': 0.35, filter: 'url(#shadow)', opacity: 0 }, g);
    el('rect', { class: 'ring', x: p.x - 2, y: p.y - 10, width: p.w + 4, height: p.h + 12, rx: 3, fill: 'none',
      stroke: C.teal, 'stroke-width': 1.2 }, g);
    const label = el('text', { x: cx, y: p.y - 2.6, 'text-anchor': 'middle', 'font-size': LABEL, 'font-weight': 700,
      fill: '#000', 'font-family': 'Montserrat' }, g);
    label.textContent = p.country; fitLabels.push(label);
    const clip = el('clipPath', { id: 'clip' + i }, g);
    el('rect', { x: p.x, y: p.y, width: p.w, height: p.h, rx: 2.8 }, clip);
    el('rect', { x: p.x, y: p.y, width: p.w, height: p.h, rx: 2.8, fill: C.grey }, g);
    const fillH = p.index * PER_PCT;
    const fill = el('rect', { x: p.x - 1, y: p.y + p.h - fillH, width: p.w + 2, height: fillH, fill: C.purple, 'clip-path': `url(#clip${i})` }, g);
    // two reference lines (range ends, or the selected city): solid black with a white halo, as in the video
    const mkLine = () => {
      const lg = el('g', { opacity: 0 }, g);
      const halo = el('line', { x1: p.x + 2, x2: p.x + p.w - 2, stroke: '#fff', 'stroke-width': 3, 'stroke-linecap': 'round' }, lg);
      const line = el('line', { x1: p.x + 2, x2: p.x + p.w - 2, stroke: '#000', 'stroke-width': 1.7, 'stroke-linecap': 'round' }, lg);
      return { g: lg, els: [halo, line] };
    };
    const lines = [mkLine(), mkLine()];
    const vals = el('g', {}, g);
    const badge = el('rect', { y: p.y + 1.8, height: 8.6, rx: 1.6, fill: C.purple }, vals);
    const mt = el('text', { x: cx, y: p.y + 9.4, 'text-anchor': 'middle', fill: '#fff', 'font-family': 'Montserrat' }, vals);
    const mNum = el('tspan', { 'font-size': 9 }, mt);
    const mU = el('tspan', { 'font-size': 5.2, dy: -2.6 }, mt); mU.textContent = 'min';
    const cs = p.city.length > 9 ? 7 : p.city.length > 7 ? 8 : 9;
    const city = el('text', { x: cx, y: p.y + 19.6, 'text-anchor': 'middle', 'font-size': cs, fill: '#000', 'font-family': 'Montserrat' }, vals);
    city.textContent = p.city;
    const pt = el('text', { x: cx + 1, y: p.y + 42.6, 'text-anchor': 'middle', fill: '#fff', 'font-family': 'Montserrat' }, vals);
    const pNum = el('tspan', { 'font-size': 9, 'font-weight': 700 }, pt);
    const pU = el('tspan', { 'font-size': 5.2, dy: -3 }, pt);
    const yOf = v => p.y + p.h - v * PER_PCT;
    const st = () => ({ op: 1, vop: 1, k: 1, dy: 0, card: 0, l0: yOf(MIN), l1: yOf(MAX), o0: 0, o1: 0,
                        fill: hex(C.purple), badge: hex(C.purple) });
    const q = P[p.city] = { ...p, cx, cy, g, card, fill, fillH, lines, vals, badge, mt, mNum, pNum, pU, yOf, cur: st(), tgt: st() };
    g.addEventListener('click', e => { e.stopPropagation(); select(q.city); });
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(q.city); } });
  });
  const ALL = Object.values(P);
  const fitAll = () => fitLabels.forEach(t => {
    const spans = t.querySelectorAll('tspan');
    const w = spans.length ? Math.max(...[...spans].map(s => s.getComputedTextLength())) : t.getComputedTextLength(), max = 44;
    if (w > max) t.setAttribute('font-size', (LABEL * max / w).toFixed(2));
  });
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;

  // ---------- state ----------
  const DEFAULT = { lo: MIN, hi: MAX, selected: null };
  const S = { ...DEFAULT };
  const lo = $('#lo'), hi = $('#hi');
  [lo, hi].forEach(r => { r.min = MIN; r.max = MAX; });
  $('#endLo').textContent = MIN + '%'; $('#endHi').textContent = MAX + '%';
  const full = () => S.lo === MIN && S.hi === MAX;
  const passes = p => p.index >= S.lo && p.index <= S.hi;
  const sign = d => d > 0 ? '+' + d : d < 0 ? '−' + -d : '±0';
  const fmt1 = d => sign(Math.round(d * 10) / 10);

  // handle position on the scale, in px inside #range (thumb 44 px wide)
  const thumbX = v => { const W = $('#range').offsetWidth; return 22 + (v - MIN) / (MAX - MIN) * (W - 44); };

  function drawRange() {
    lo.value = S.lo; hi.value = S.hi;
    const x0 = thumbX(S.lo), x1 = thumbX(S.hi);
    Object.assign($('#band').style, { left: x0 - 19 + 'px', width: x1 - x0 + 38 + 'px' });
    const k = ALL.filter(passes).length;
    const stat = $('#stat');
    stat.textContent = `${k} ${k === 1 ? 'capital' : 'capitals'}`;
    // centre the count on the band, but step aside so the EU-average marker never cuts through it
    const w = stat.offsetWidth, xe0 = thumbX(EU), in0 = x0 + 22, in1 = x1 - 22;
    let cx = (x0 + x1) / 2, room = in1 - in0;
    if (xe0 > in0 && xe0 < in1 && Math.abs(xe0 - cx) < w / 2 + 12) {
      const left = xe0 - in0, right = in1 - xe0;
      [cx, room] = left > right ? [(in0 + xe0) / 2, left] : [(xe0 + in1) / 2, right];
    }
    stat.style.left = cx + 'px';
    stat.classList.toggle('out', room < w + 16);
    if (room < w + 16) stat.style.left = (x0 + x1) / 2 + 'px';
    const tl = $('#tvLo'), th = $('#tvHi');
    tl.textContent = S.lo + '%'; th.textContent = S.hi + '%';
    tl.style.left = x0 + 'px'; th.style.left = x1 + 'px';
    const close = x1 - x0 < 60;
    tl.style.transform = `translateX(${close ? '-100%' : '-50%'})`; th.style.transform = `translateX(${close ? '0' : '-50%'})`;
    // the end labels hide when a handle sits on them
    $('#endLo').style.opacity = S.lo - MIN < 4 ? 0 : 1; $('#endHi').style.opacity = MAX - S.hi < 4 ? 0 : 1;
    const xe = thumbX(EU), eL = $('#euLbl');
    $('#euTick').style.left = xe + 'px'; eL.style.left = xe + 'px'; eL.textContent = `EU avg ${EU}%`;
    eL.style.opacity = Math.min(Math.abs(EU - S.lo), Math.abs(EU - S.hi)) < 5 ? 0 : 1;
    // keep the low handle reachable when both meet at the top
    lo.style.zIndex = S.lo > MAX - 2 ? 3 : 1; hi.style.zIndex = 2;
  }

  function panelHTML() {
    const sel = S.selected && P[S.selected];
    const shown = ALL.filter(passes);
    if (sel) {
      const others = shown.filter(p => p !== sel);
      if (!others.length) return `<b class="k">${sel.city}</b>: ${sel.index}%, ${sel.minutes} min to drive 10 km. No other capital is in the selected range.`;
      const less = others.filter(p => p.index < sel.index).length, more = others.filter(p => p.index > sel.index).length;
      const same = others.length - less - more, n = others.length;
      const dI = mean(others.map(p => p.index - sel.index)), dM = mean(others.map(p => p.minutes - sel.minutes));
      const split = less === n ? `<b class="t">all ${n} are less congested</b>` : more === n ? `<b>all ${n} are more congested</b>`
        : `<b class="t">${less} less congested</b>, <b>${more} more</b>${same ? `, ${same} the same` : ''}`;
      return `<b class="k">${sel.city}</b>: ${sel.index}% (EU average ${EU}%), ${sel.minutes} min to drive 10 km. Of the ${n} other capitals ${full() ? 'on the map' : 'in the range'}, ${split}. ` +
             `Average gap: <b class="k">${fmt1(dI)} pts, ${fmt1(dM)} min</b>.`;
    }
    if (full()) return 'Drag the ends of the scale to pick a congestion range, or tap any capital to compare it with the others.';
    const k = shown.length;
    return `<b>${k} of ${ALL.length} capitals</b> ${k === 1 ? 'has' : 'have'} a congestion index between <b class="k">${S.lo}%</b> and <b class="k">${S.hi}%</b>.`;
  }

  function legendHTML() {
    const sel = S.selected && P[S.selected];
    const it = (sw, txt) => `<div class="it"><span class="sw ${sw === 'line' ? 'line' : ''}" style="${sw === 'line' ? '' : 'background:' + sw}"></span><span>${txt}</span></div>`;
    const note = '<div class="it note">Fill height = congestion index</div>';
    if (sel) return it(C.teal, `Lower than ${sel.city}`) + it(C.purple, `Higher than ${sel.city}`) + it('line', `EU average ${EU}%`) + note;
    return note;
  }

  // ---------- targets (pure function of state) ----------
  function update() {
    drawRange();
    const sel = S.selected && P[S.selected];
    ALL.forEach(p => {
      const T = p.tgt, isSel = p === sel, ok = passes(p) || isSel;
      T.op = ok ? 1 : DIM; T.vop = ok ? 1 : 0;
      T.k = isSel ? 1.6 : 1; T.card = isSel ? 1 : 0;
      // keep the enlarged card inside the map band (chart y 60..576)
      const top = p.cy - 1.6 * (p.cy - (p.y - 11.5)), bot = p.cy + 1.6 * (p.y + p.h + 3.5 - p.cy);
      T.dy = isSel ? Math.max(0, 60 - top) - Math.max(0, bot - 576) : 0;
      let fill = C.purple, badge = C.purple, mins = String(p.minutes), pct = String(p.index), pu = '%';
      if (sel && !isSel) {
        const di = p.index - sel.index, dm = p.minutes - sel.minutes;
        fill = di < 0 ? C.teal : di > 0 ? C.purple : C.same;
        badge = dm < 0 ? C.teal : dm > 0 ? C.purple : C.same;
        mins = sign(dm); pct = sign(di); pu = 'pts';
      }
      T.l0 = p.yOf(EU); T.o0 = isSel ? 1 : 0; T.o1 = 0;   // EU-average line: selected city only
      T.fill = hex(fill); T.badge = hex(badge);
      p.mNum.textContent = mins; p.pNum.textContent = pct; p.pU.textContent = pu;
      const bw = Math.max(20, p.mt.getComputedTextLength() + 4.6);
      p.badge.setAttribute('x', p.cx - bw / 2); p.badge.setAttribute('width', bw);
      p.g.setAttribute('aria-pressed', isSel);
    });
    if (sel) pillsG.appendChild(sel.g);
    lg.innerHTML = legendHTML();
    setPanel(panelHTML());
  }

  // ---------- panel with a short cross-fade ----------
  const panel = $('#panel');
  const PN = { op: 1, tgt: 1, html: '', next: null, override: null };
  const setPanel = h => { PN.live = h; const want = PN.override ?? h; if (want !== PN.html) { PN.next = want; PN.tgt = 0; } };

  // ---------- animation: exponential easing, driven by real time or a seekable clock ----------
  const lerp = (a, b, t) => a + (b - a) * t;
  function tick(dt) {
    const a = 1 - Math.exp(-dt / 0.085), ak = 1 - Math.exp(-dt / 0.07);
    ALL.forEach(p => {
      const c = p.cur, T = p.tgt;
      ['op', 'vop', 'card', 'l0', 'l1', 'o0', 'o1', 'dy'].forEach(k => { c[k] = lerp(c[k], T[k], a); });
      c.k = lerp(c.k, T.k, ak);
      for (let i = 0; i < 3; i++) { c.fill[i] = lerp(c.fill[i], T.fill[i], a); c.badge[i] = lerp(c.badge[i], T.badge[i], a); }
      p.g.setAttribute('opacity', c.op.toFixed(3));
      p.vals.setAttribute('opacity', c.vop.toFixed(3));
      p.card.setAttribute('opacity', c.card.toFixed(3));
      p.g.setAttribute('transform', `translate(${p.cx} ${p.cy + c.dy}) scale(${c.k.toFixed(4)}) translate(${-p.cx} ${-p.cy})`);
      p.fill.setAttribute('fill', `rgb(${c.fill.map(Math.round)})`);
      p.badge.setAttribute('fill', `rgb(${c.badge.map(Math.round)})`);
      [[c.l0, c.o0], [c.l1, c.o1]].forEach(([y, o], i) => {
        p.lines[i].g.setAttribute('opacity', o.toFixed(3));
        p.lines[i].els.forEach(l => { l.setAttribute('y1', y); l.setAttribute('y2', y); });
      });
    });
    PN.op = lerp(PN.op, PN.tgt, 1 - Math.exp(-dt / 0.05));
    if (PN.tgt === 0 && PN.op < 0.04) { panel.innerHTML = PN.html = PN.next; PN.tgt = 1; }
    panel.style.opacity = PN.op.toFixed(3);
  }
  const snap = () => { ALL.forEach(p => { const c = p.cur, T = p.tgt;
    Object.assign(c, { ...T, fill: [...T.fill], badge: [...T.badge] }); }); PN.op = 0.01; tick(1); };

  // ---------- interactions ----------
  function select(city) { S.selected = S.selected === city ? null : city; update(); }
  const set = partial => { Object.assign(S, partial); update(); };
  lo.addEventListener('input', () => set({ lo: Math.min(+lo.value, S.hi) }));
  hi.addEventListener('input', () => set({ hi: Math.max(+hi.value, S.lo) }));
  $('#reset').addEventListener('click', () => set({ ...DEFAULT }));
  $('#bg').addEventListener('click', () => { if (S.selected) select(S.selected); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && S.selected) select(S.selected); });

  // ---------- hooks (used by the demo renderer) ----------
  window.api = { set, select, state: S, P, toScreen, tick, thumbX, setOverride: h => { PN.override = h; setPanel(PN.live); } };
  update(); snap();
  window.ready = document.fonts.ready.then(() => document.fonts.load('700 20px Montserrat')).then(() => { fitAll(); update(); snap(); return true; });

  if (!location.search.includes('demo')) {
    let last = performance.now();
    const loop = now => { tick(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    const s = document.createElement('script'); s.src = 'demo.js'; document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
